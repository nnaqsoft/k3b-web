name: build

# Build the multi-arch image. On a semver tag (vX.Y.Z) the image is pushed to
# Docker Hub with semver + latest tags. On pushes/PRs to main it is built only
# (no push) so the Dockerfile stays verified without needing secrets.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/k3b-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in when we actually intend to push (tag builds).
      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Sync DOCKERHUB.md to the Docker Hub repo Overview (and set the short
  # description) so the Hub page mirrors the GitHub README. Runs on any push
  # (not PRs, which have no secrets).
  #
  # NOTE: Docker Hub blocks editing a repo's description with an ordinary
  # pull/push access token (the PATCH returns 403 Forbidden). It only works with
  # a full password-auth login. So this job prefers a DOCKERHUB_PASSWORD secret
  # (your account password, or a token that carries account scope) and falls back
  # to DOCKERHUB_TOKEN. It is best-effort: continue-on-error keeps a 403 from
  # failing the build. If you do not add DOCKERHUB_PASSWORD, update the Overview
  # once by hand by pasting DOCKERHUB.md into the Docker Hub repo page.
  dockerhub-description:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Docker Hub description
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD || secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/k3b-web
          readme-filepath: ./DOCKERHUB.md
          short-description: "K3b CD/DVD/Blu-ray burning suite in your browser via noVNC. Burn, rip, CD-Text, gapless DAO."
